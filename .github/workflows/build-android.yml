name: Compilar APK Android

# Se ejecuta solo al subir cambios a main, o a mano desde la pestaña Actions
# (botón "Run workflow").
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar componentes del SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Descargar Godot y sus plantillas
        shell: bash
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          cp -r templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Crear keystore de depuración
        shell: bash
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configurar Godot (SDK, Java y keystore)
        shell: bash
        run: |
          GODOT="./Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          # Una pasada en modo editor: importa el proyecto y crea el archivo de ajustes.
          $GODOT --headless --editor --quit --path . || true
          SETTINGS=$(ls "$HOME"/.config/godot/editor_settings-*.tres 2>/dev/null | head -n1 || true)
          if [ -z "$SETTINGS" ]; then
            mkdir -p "$HOME/.config/godot"
            SETTINGS="$HOME/.config/godot/editor_settings-4.7.tres"
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
          fi
          {
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo "export/android/debug_keystore_user = \"androiddebugkey\""
            echo "export/android/debug_keystore_pass = \"android\""
          } >> "$SETTINGS"

      - name: Compilar APK de depuración
        shell: bash
        run: |
          mkdir -p builds
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --export-debug Android builds/Tiles-FOSS-debug.apk

      - name: Entregar APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiles-FOSS-Android
          path: builds/Tiles-FOSS-debug.apk
          if-no-files-found: error
